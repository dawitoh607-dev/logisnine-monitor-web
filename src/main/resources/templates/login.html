<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LOGIS NINE - 로그인</title>

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

</head>


<body>


<main class="login-page">

    <div class="login-card">


        <div class="logo">

            <div class="logo-mark">
                L9
            </div>

            <div class="logo-text">

                <strong>
                    LOGIS NINE
                </strong>

                <span>
                    IoT Logistics Monitoring
                </span>

            </div>

        </div>


        <div class="login-title">

            <h1>
                물류 관제 시스템
            </h1>

            <p>
                관리자 계정으로 로그인해주세요.
            </p>

        </div>


        <!-- 로그인 실패 -->

        <div class="login-message error"
             th:if="${param.error}">

            아이디 또는 비밀번호가 올바르지 않습니다.

        </div>


        <!-- 로그아웃 완료 -->

        <div class="login-message success"
             th:if="${param.logout}">

            로그아웃되었습니다.

        </div>


        <form th:action="@{/login}"
              method="post">


            <div class="form-group">

                <label for="username">
                    아이디
                </label>

                <input type="text"
                       id="username"
                       name="username"
                       autocomplete="username"
                       placeholder="아이디 입력"
                       required
                       autofocus>

            </div>


            <div class="form-group">

                <label for="password">
                    비밀번호
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       autocomplete="current-password"
                       placeholder="비밀번호 입력"
                       required>

            </div>


            <button type="submit"
                    class="login-button">

                로그인

            </button>


        </form>


        <div class="login-footer">

            LOGIS NINE · PoC Monitoring System

        </div>


    </div>

</main>


</body>
</html>
