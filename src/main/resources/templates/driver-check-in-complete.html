<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0">

    <title>운송정보 등록 완료</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            background: #f4f7fb;

            color: #16233c;

            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Pretendard",
                    "Segoe UI",
                    sans-serif;
        }

        .container {

            max-width: 520px;

            margin: 0 auto;

            padding: 90px 20px;
        }

        .card {

            padding: 42px 24px;

            border-radius: 18px;

            background: white;

            text-align: center;
        }

        .check {

            width: 64px;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #daf9e8;

            color: #13ad63;

            font-size: 30px;
            font-weight: 850;
        }

        h1 {

            margin: 0;

            font-size: 22px;
        }

        p {

            margin: 10px 0 0;

            color: #7e8ca0;

            font-size: 13px;
            line-height: 1.6;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="check">
            ✓
        </div>

        <h1>
            운송정보 등록 완료
        </h1>

        <p>
            기사 및 차량정보가 정상적으로
            등록되었습니다.<br>

            이 화면은 닫으셔도 됩니다.
        </p>

    </div>

</div>

</body>
</html>
