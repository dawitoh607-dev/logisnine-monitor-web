<!DOCTYPE html>

<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LOGIS NINE - 운송 목록</title>


    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/css/shipment-list.css}">

</head>


<body>


<!-- =====================================================
     HEADER
====================================================== -->

<header class="header">

    <div class="logo">

        <i class="bi bi-truck"></i>

        <span>
            LOGIS
            <strong>NINE</strong>
        </span>

    </div>


    <button class="menu-button">

        <i class="bi bi-list"></i>

    </button>

</header>



<!-- =====================================================
     MAIN
====================================================== -->

<main class="container">


    <!-- =================================================
         TITLE
    ================================================== -->

    <section class="page-header">

        <div>

            <h1>
                운송 현황
            </h1>

            <p>
                등록된 운송과 실시간 상태를 확인합니다.
            </p>

        </div>


        <div class="shipment-total">

            <span>
                전체 운송
            </span>

            <strong th:text="${totalCount}">
                4
            </strong>

        </div>

    </section>



    <!-- =================================================
         STATUS FILTER
    ================================================== -->

    <nav class="status-filter">


        <!-- 전체 -->

        <a th:href="@{/shipments(status='ALL')}"
           class="filter-item"
           th:classappend="${selectedStatus == 'ALL'} ? ' active'">

            <span>
                전체
            </span>

            <strong th:text="${totalCount}">
                4
            </strong>

        </a>


        <!-- 운송중 -->

        <a th:href="@{/shipments(status='IN_PROGRESS')}"
           class="filter-item"
           th:classappend="${selectedStatus == 'IN_PROGRESS'} ? ' active'">

            <span>
                운송중
            </span>

            <strong th:text="${inProgressCount}">
                2
            </strong>

        </a>


        <!-- 운송대기 -->

        <a th:href="@{/shipments(status='READY')}"
           class="filter-item"
           th:classappend="${selectedStatus == 'READY'} ? ' active'">

            <span>
                운송대기
            </span>

            <strong th:text="${readyCount}">
                1
            </strong>

        </a>


        <!-- 완료 -->

        <a th:href="@{/shipments(status='COMPLETED')}"
           class="filter-item"
           th:classappend="${selectedStatus == 'COMPLETED'} ? ' active'">

            <span>
                완료
            </span>

            <strong th:text="${completedCount}">
                1
            </strong>

        </a>


    </nav>



    <!-- =================================================
         EMPTY
    ================================================== -->

    <div class="empty-state"
         th:if="${shipments == null or #lists.isEmpty(shipments)}">

        <i class="bi bi-inbox"></i>

        <strong>
            운송 내역이 없습니다.
        </strong>

        <span>
            해당 상태의 운송이 없습니다.
        </span>

    </div>



    <!-- =================================================
         SHIPMENT LIST
    ================================================== -->

    <section class="shipment-list"
             th:if="${shipments != null and !#lists.isEmpty(shipments)}">


        <a class="shipment-card"

           th:each="shipment : ${shipments}"

           th:href="@{/shipments/{id}(id=${shipment.shipmentId})}">


            <!-- =========================================
                 카드 상단
            ========================================== -->

            <div class="shipment-card-header">


                <div class="shipment-number">

                    운송 #

                    <strong th:text="${shipment.shipmentId}">
                        4
                    </strong>

                </div>


                <span class="status-badge"

                      th:classappend="${shipment.status == 'IN_PROGRESS'}
                            ? ' in-progress'
                            : (${shipment.status == 'COMPLETED'}
                                ? ' completed'
                                : ' ready')"

                      th:text="${shipment.statusName}">

                    운송중

                </span>


            </div>



            <!-- =========================================
                 품목
            ========================================== -->

            <div class="cargo-name"
                 th:text="${shipment.cargoName}">

                냉동식품 운송

            </div>



            <!-- =========================================
                 ROUTE
            ========================================== -->

            <div class="route">

                <span th:text="${shipment.departureLocation}">
                    서울 물류센터
                </span>

                <i class="bi bi-arrow-right"></i>

                <span th:text="${shipment.destinationLocation}">
                    부산 물류센터
                </span>

            </div>



            <!-- =========================================
                 기본정보
            ========================================== -->

            <div class="shipment-meta">


                <div>

                    <i class="bi bi-truck"></i>

                    <span th:text="${shipment.vehicleNumber != null
                            ? shipment.vehicleNumber
                            : '-'}">

                        12가3456

                    </span>

                </div>


                <div>

                    <i class="bi bi-router"></i>

                    <span th:text="${shipment.gatewayId}">

                        GW-001

                    </span>

                </div>


            </div>



            <!-- =========================================
                 EVENT COUNT
            ========================================== -->

            <div class="event-summary">


                <div class="event-item temperature">

                    <i class="bi bi-thermometer-high"></i>

                    <span>
                        온도 이탈
                    </span>

                    <strong th:text="${shipment.tempDeviationCount + '건'}">
                        2건
                    </strong>

                </div>


                <div class="event-item shock">

                    <i class="bi bi-activity"></i>

                    <span>
                        충격
                    </span>

                    <strong th:text="${shipment.shockCount + '건'}">
                        1건
                    </strong>

                </div>


            </div>



            <!-- =========================================
                 운송시간
            ========================================== -->

            <div class="shipment-period">


                <!-- READY -->

                <span th:if="${shipment.status == 'READY'}">

                    <i class="bi bi-clock"></i>

                    운송 시작 전

                </span>


                <!-- IN_PROGRESS -->

                <span th:if="${shipment.status == 'IN_PROGRESS'}">

                    <i class="bi bi-clock"></i>

                    <span th:text="${#temporals.format(
                            shipment.startedAt,
                            'MM.dd HH:mm'
                    )}">
                        10.27 10:00
                    </span>

                    ~

                    <strong>
                        운송중
                    </strong>

                </span>


                <!-- COMPLETED -->

                <span th:if="${shipment.status == 'COMPLETED'}">

                    <i class="bi bi-clock"></i>

                    <span th:text="${#temporals.format(
                            shipment.startedAt,
                            'MM.dd HH:mm'
                    )}">
                        10.26 08:00
                    </span>

                    ~

                    <span th:text="${#temporals.format(
                            shipment.endedAt,
                            'MM.dd HH:mm'
                    )}">
                        10.26 15:30
                    </span>

                </span>


                <i class="bi bi-chevron-right card-arrow"></i>

            </div>


        </a>


    </section>


</main>


</body>

</html>
